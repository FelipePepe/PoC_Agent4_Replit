repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: protected-branch-commit
        name: Block commits on protected branches
        entry: python scripts/git_hooks/check_protected_branch.py
        language: system
        pass_filenames: false
      - id: branch-naming-policy
        name: Validate branch naming policy
        entry: python scripts/git_hooks/check_branch_naming.py
        language: system
        pass_filenames: false
      - id: gitleaks
        name: Run gitleaks (secret scanning)
        entry: python scripts/git_hooks/run_gitleaks.py
        language: system
        pass_filenames: false
        # Skips gracefully if gitleaks binary is not installed.
        # Install with: https://github.com/gitleaks/gitleaks#installing
      - id: check-coverage
        name: Check test coverage (≥ 99%)
        entry: python scripts/git_hooks/check_coverage.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        # Blocks the commit if coverage drops below 99%.
      - id: sonar-analysis
        name: Run SonarQube analysis (background, non-blocking)
        entry: python scripts/git_hooks/run_sonar.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        # Launches sonar-scanner in the background after push — non-blocking.
        # Skips gracefully if Docker is unavailable or SONAR_TOKEN is not set.
