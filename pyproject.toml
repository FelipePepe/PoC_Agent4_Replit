[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-agent4-replit"
version = "0.1.0"
description = "Spec-first learning PoC for a Replit Agent 4 style multi-agent backend."
readme = "AGENTS.md"
requires-python = ">=3.11"
authors = [
  { name = "sandman" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "gitpython>=3.1,<4.0",
  "langchain-anthropic>=0.2",
  "langgraph>=0.2",
  "langsmith>=0.1",
  "mcp>=1.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=core --cov=agents --cov-branch --cov-fail-under=90 --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["core", "agents"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.setuptools.packages.find]
include = ["core*", "agents*"]
exclude = ["tests*"]
